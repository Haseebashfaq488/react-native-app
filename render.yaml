# Render Blueprint for the SupportSync (NovaWare AI Support) FastAPI backend.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render dashboard: New -> Blueprint -> connect this repo.
#   3. Render reads this file, provisions the web service, and sets up
#      auto-deploy on every push to `main`.
#
# SECURITY: The secret env var values below are PLACEHOLDERS. Set the real
# values in the Render dashboard (service -> Environment) — never commit
# real keys to this public repo. The app's live LLM/Supabase/Resend keys
# are intentionally NOT here.

services:
  - type: web
    name: supportsync-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # --- LLM provider --------------------------------
      # "groq" (default) or "gemini"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_TIMEOUT
        value: "30"
      # --- LLM API keys (set real values in dashboard) -
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      # --- Supabase (set real values in dashboard) -----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # --- Resend email (set real values in dashboard) -
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        sync: false
